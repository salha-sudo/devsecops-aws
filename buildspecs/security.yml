# Gate securite : tout echec bloque le pipeline.
version: 0.2
env:
  shell: bash
  variables:
    GITLEAKS_VERSION: "8.21.2"
    TRIVY_VERSION: "v0.58.1"
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin ${TRIVY_VERSION}
      - pip install --quiet semgrep pip-audit checkov cfn-lint
  build:
    commands:
      - echo "[1/6] Detection de secrets (Gitleaks)"
      - gitleaks detect --no-git --source . --redact
      - echo "[2/6] SAST (Semgrep)"
      - semgrep scan --config p/default --config p/owasp-top-ten --metrics=off --error app/
      - echo "[3/6] SCA (pip-audit + Trivy)"
      - pip-audit -r app/requirements.txt
      - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - echo "[4/6] Lint IaC (cfn-lint)"
      - cfn-lint infra/*.yaml --ignore-checks W
      - echo "[5/6] Scan IaC (Checkov, rapport seulement - retirer --soft-fail pour bloquer)"
      - checkov -d infra --framework cloudformation --soft-fail --quiet
      - echo "[6/6] OK - aucune vulnerabilite bloquante"

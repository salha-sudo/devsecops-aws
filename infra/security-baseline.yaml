AWSTemplateFormatVersion: "2010-09-09"
Description: Baseline securite runtime (optionnel) - GuardDuty + Security Hub
# A ne deployer que si ces services ne sont PAS deja actives dans le compte/la region.
Resources:
  GuardDuty:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Properties:
      EnableDefaultStandards: true
